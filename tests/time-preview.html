<script>
(() => {
  const params = new URLSearchParams(location.search);
  const hours = { morning: 7, day: 12, evening: 18, night: 22, witching: 2 };
  const band = Object.hasOwn(hours, params.get('band')) ? params.get('band') : 'night';
  const requestedScreen = params.get('screen');
  const previewScreen = ['title', 'home', 'dex'].includes(requestedScreen) ? requestedScreen : 'title';
  gameTimeProvider = () => gameTimeAt(new Date(2026, 6, 18, hours[band], 0));
  screen = previewScreen;
  render();
})();
</script>
