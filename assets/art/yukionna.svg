<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 雪女: 白い着物・雪の結晶・裾は吹雪に消える -->
  <!-- 雪の結晶 -->
  <g stroke="#f5f0e6" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M24 40 v 14 M17 47 h 14 M19 42 l 10 10 M29 42 l -10 10"/>
    <path d="M104 62 v 12 M98 68 h 12 M100 64 l 8 8 M108 64 l -8 8"/>
    <path d="M100 24 v 10 M95 29 h 10 M96.5 25.5 l 7 7 M103.5 25.5 l -7 7"/>
  </g>
  <!-- 長い黒髪(後ろ) -->
  <path d="M42 40 C 40 62, 38 84, 34 98 C 40 96, 44 90, 46 82 L 82 82 C 84 90, 88 96, 94 98 C 90 84, 88 62, 86 40 Z"
        fill="#3d2f5e" stroke="#2a1f3d" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- 白い着物(裾がすっと消える) -->
  <path d="M50 66 C 44 80, 42 94, 44 102 C 40 108, 34 112, 27 113 C 44 118, 62 117, 74 112 C 86 108, 92 100, 94 92 C 88 94, 84 92, 82 86 C 81 78, 80 72, 78 66 Z"
        fill="#f5f0e6" stroke="#2a1f3d" stroke-width="5" stroke-linejoin="round"/>
  <!-- 衿 -->
  <path d="M56 68 L 64 80 L 72 68" fill="none" stroke="#5b8dd9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 袖の中で手を重ねる -->
  <path d="M50 80 C 55 86, 73 86, 78 80 L 80 88 C 72 94, 56 94, 48 88 Z"
        fill="#f5f0e6" stroke="#2a1f3d" stroke-width="4" stroke-linejoin="round"/>
  <!-- 帯 -->
  <path d="M49 98 C 60 101, 68 101, 79 97" fill="none" stroke="#5b8dd9" stroke-width="6" stroke-linecap="round"/>
  <!-- 顔 -->
  <path d="M46 44 C 46 30, 54 22, 64 22 C 74 22, 82 30, 82 44 C 82 56, 74 64, 64 64 C 54 64, 46 56, 46 44 Z"
        fill="#fff6cf" stroke="#2a1f3d" stroke-width="5" stroke-linejoin="round"/>
  <!-- 姫カットの前髪と横髪 -->
  <path d="M44 46 C 43 28, 52 18, 64 18 C 76 18, 85 28, 84 46 C 84 52, 83 57, 81 61 L 77 59 C 78 52, 78 46, 77 41 C 73 43, 69 44, 64 44 C 59 44, 55 43, 51 41 C 50 46, 50 52, 51 59 L 47 61 C 45 57, 44 52, 44 46 Z"
        fill="#3d2f5e" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- 切れ長の目 -->
  <ellipse cx="57" cy="49" rx="4.2" ry="3" fill="#f5f0e6" stroke="#2a1f3d" stroke-width="2.5"/>
  <ellipse cx="71" cy="49" rx="4.2" ry="3" fill="#f5f0e6" stroke="#2a1f3d" stroke-width="2.5"/>
  <circle cx="57" cy="49.5" r="1.8" fill="#2a1f3d"/>
  <circle cx="71" cy="49.5" r="1.8" fill="#2a1f3d"/>
  <path d="M52 44.5 q 5 -2.5 9 -0.5 M76 44.5 q -5 -2.5 -9 -0.5" fill="none" stroke="#2a1f3d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 紅 -->
  <path d="M62 58 q 2 1.8 4 0" fill="none" stroke="#e2574c" stroke-width="3" stroke-linecap="round"/>
  <!-- 冷たい頬 -->
  <circle cx="51.5" cy="54" r="3.2" fill="#5b8dd9" opacity="0.35"/>
  <circle cx="76.5" cy="54" r="3.2" fill="#5b8dd9" opacity="0.35"/>
</svg>
