  <path d="M44 44 C 44 36, 50 30, 60 30 C 70 30, 76 36, 76 44 C 76 52, 70 58, 60 58 C 50 58, 44 52, 44 44 Z"
        fill="#fff6cf" stroke="#5a2030" stroke-width="3.5"/>
  <!-- 眉間のしわ -->
  <path d="M53 33 l 5 3 M67 33 l -5 3" stroke="#5a2030" stroke-width="3" stroke-linecap="round"/>
  <!-- 目 -->
  <circle cx="54" cy="42" r="5" fill="#f5f0e6" stroke="#5a2030" stroke-width="3"/>
  <circle cx="66" cy="42" r="5" fill="#f5f0e6" stroke="#5a2030" stroke-width="3"/>
  <circle cx="54.5" cy="43" r="2.4" fill="#5a2030"/>
  <circle cx="65.5" cy="43" r="2.4" fill="#5a2030"/>
  <!-- 鼻・への字口と小さな牙 -->
  <path d="M58.5 49 q 1.5 2 3 0" fill="none" stroke="#5a2030" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M53 54.5 q 7 -4 14 0" fill="none" stroke="#5a2030" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M54.5 53.5 l 1 4.5 l 2.5 -3.5 Z" fill="#f5f0e6" stroke="#5a2030" stroke-width="1.6"/>
  <path d="M65.5 53.5 l -1 4.5 l -2.5 -3.5 Z" fill="#f5f0e6" stroke="#5a2030" stroke-width="1.6"/>
  <!-- 頬 -->
  <circle cx="46" cy="49" r="3.5" fill="#e2574c" opacity="0.45"/>
  <circle cx="74" cy="49" r="3.5" fill="#e2574c" opacity="0.45"/>
</svg>
