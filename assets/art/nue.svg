  <path d="M42 93 C 45 97, 50 97, 53 94 M86 93 C 83 97, 78 97, 75 94" fill="none" stroke="#fff6cf" stroke-width="4" stroke-linecap="round"/>
  <path d="M43 97 l 1 -3 M47.5 98.5 l 0.5 -3.5 M85 97 l -1 -3 M80.5 98.5 l -0.5 -3.5" stroke="#5a2030" stroke-width="2" stroke-linecap="round"/>
  <path d="M59 84 L 59 94 C 60 98, 68 98, 69 94 L 69 84 Z" fill="#ffb347" stroke="#5a2030" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M60 94 q 4 2.5 8 0" fill="none" stroke="#fff6cf" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 猿の頭 -->
  <circle cx="38" cy="42" r="6.5" fill="#c9a24b" stroke="#5a2030" stroke-width="3.5"/>
  <circle cx="82" cy="42" r="6.5" fill="#c9a24b" stroke="#5a2030" stroke-width="3.5"/>
