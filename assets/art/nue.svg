        fill="#3d2f5e" stroke="#2a1f3d" stroke-width="4" stroke-linejoin="round"/>
  <path d="M28 92 q 8 -4 16 0 M84 92 q 8 -4 16 0" fill="none" stroke="#aab2c0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- 蛇の尾 -->
  <path d="M88 74 C 100 70, 108 60, 104 48 C 102 42, 96 40, 92 44" fill="none" stroke="#5a2030" stroke-width="10.5" stroke-linecap="round"/>
  <path d="M88 74 C 100 70, 108 60, 104 48 C 102 42, 96 40, 92 44" fill="none" stroke="#5eb87a" stroke-width="6" stroke-linecap="round"/>
