<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 大蝦蟇: 岩ほどの巨大な蟇蛙と毒の靄 -->
  <!-- 毒の靄 -->
  <path d="M20 74 C 12 72, 10 64, 16 60 C 12 54, 18 48, 24 51 C 24 44, 34 42, 37 49 C 33 55, 33 62, 30 68 C 27 72, 24 74, 20 74 Z"
