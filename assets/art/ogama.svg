  <path d="M50 80 h 28 M48 88 h 32" stroke="#c9a24b" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- 前足 -->
  <path d="M40 96 L 36 110 L 52 110 L 50 98 Z" fill="#5eb87a" stroke="#2a1f3d" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M88 96 L 92 110 L 76 110 L 78 98 Z" fill="#5eb87a" stroke="#2a1f3d" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M40 110 v -5 M46 110 v -6 M82 110 v -6 M88 110 v -5" stroke="#2a1f3d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- いぼ(水属性の青) -->
  <circle cx="44" cy="52" r="3" fill="#5b8dd9" opacity="0.85"/>
  <circle cx="84" cy="52" r="3" fill="#5b8dd9" opacity="0.85"/>
  <circle cx="64" cy="45" r="2.5" fill="#5b8dd9" opacity="0.85"/>
  <circle cx="34" cy="70" r="2.5" fill="#5b8dd9" opacity="0.85"/>
  <circle cx="94" cy="70" r="2.5" fill="#5b8dd9" opacity="0.85"/>
  <!-- 目玉(頭の上のこぶ) -->
  <path d="M34 40 C 34 30, 42 26, 48 28 C 54 30, 56 38, 52 44 Z" fill="#5eb87a" stroke="#2a1f3d" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M94 40 C 94 30, 86 26, 80 28 C 74 30, 72 38, 76 44 Z" fill="#5eb87a" stroke="#2a1f3d" stroke-width="4.5" stroke-linejoin="round"/>
  <ellipse cx="45" cy="35" rx="5.5" ry="6" fill="#fff6cf" stroke="#2a1f3d" stroke-width="3"/>
  <ellipse cx="83" cy="35" rx="5.5" ry="6" fill="#fff6cf" stroke="#2a1f3d" stroke-width="3"/>
  <circle cx="45" cy="36" r="2.6" fill="#2a1f3d"/>
  <circle cx="83" cy="36" r="2.6" fill="#2a1f3d"/>
  <path d="M38 30 q 7 -4 13 0 M77 30 q 6 -4 13 0" fill="none" stroke="#2a1f3d" stroke-width="3" stroke-linecap="round"/>
  <!-- 大口(への字) -->
  <path d="M40 56 C 48 62, 80 62, 88 56" fill="none" stroke="#2a1f3d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M40 56 q -2 4 -6 5 M88 56 q 2 4 6 5" fill="none" stroke="#2a1f3d" stroke-width="4" stroke-linecap="round"/>
  <!-- 頬 -->
  <circle cx="38" cy="62" r="4" fill="#e2574c" opacity="0.4"/>
  <circle cx="90" cy="62" r="4" fill="#e2574c" opacity="0.4"/>
</svg>
