  <circle cx="14" cy="82" r="4.5" fill="#5b8dd9" stroke="#2a1f3d" stroke-width="3" opacity="0.85"/>
  <circle cx="24" cy="79" r="2.5" fill="#5b8dd9" opacity="0.8"/>
