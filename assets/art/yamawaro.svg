<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 体(緑の着物) -->
  <path d="M46 70 C 43 86, 47 98, 64 98 C 81 98, 85 86, 82 70 Z"
        fill="#5eb87a" stroke="#5a2030" stroke-width="5" stroke-linejoin="round"/>
  <!-- 足 -->
  <ellipse cx="54" cy="100" rx="7" ry="5" fill="#fff6cf" stroke="#5a2030" stroke-width="4"/>
  <ellipse cx="74" cy="100" rx="7" ry="5" fill="#fff6cf" stroke="#5a2030" stroke-width="4"/>
  <!-- 蓑髪 -->
  <path d="M64 12 C 44 12, 30 26, 28 46 L 26 74 L 34 66 L 40 78 L 48 70 L 55 80 L 64 72 L 73 80 L 80 70 L 88 78 L 94 66 L 102 74 L 100 46 C 98 26, 84 12, 64 12 Z"
        fill="#c9a24b" stroke="#5a2030" stroke-width="5" stroke-linejoin="round"/>
  <path d="M40 26 C 36 38, 34 52, 34 64 M52 18 C 48 34, 46 52, 46 68 M82 20 C 86 36, 88 52, 88 66" fill="none" stroke="#5a2030" stroke-width="2.2" opacity="0.35"/>
  <!-- 顔 -->
  <ellipse cx="64" cy="44" rx="17" ry="15" fill="#fff6cf" stroke="#5a2030" stroke-width="4"/>
  <!-- 一つ目 -->
  <circle cx="64" cy="41" r="7" fill="#f5f0e6" stroke="#5a2030" stroke-width="3.5"/>
  <circle cx="64" cy="42" r="3.5" fill="#5a2030"/>
  <circle cx="62.5" cy="40.5" r="1.2" fill="#f5f0e6"/>
  <!-- 口と頬 -->
  <path d="M57 51 q 7 6 14 0" fill="none" stroke="#5a2030" stroke-width="4" stroke-linecap="round"/>
  <circle cx="51" cy="50" r="4" fill="#e2574c" opacity="0.4"/>
  <circle cx="77" cy="50" r="4" fill="#e2574c" opacity="0.4"/>
  <!-- 振り回す丸太(前に担ぐ) -->
  <g transform="rotate(40 92 54)">
    <rect x="85" y="26" width="14" height="56" rx="7" fill="#c9a24b" stroke="#5a2030" stroke-width="4"/>
    <ellipse cx="92" cy="28" rx="6" ry="3" fill="#fff6cf" stroke="#5a2030" stroke-width="2.5"/>
    <path d="M88 44 L 96 44 M88 58 L 96 58" fill="none" stroke="#5a2030" stroke-width="1.8" opacity="0.4"/>
  </g>
  <!-- 丸太を掴む手 -->
  <circle cx="88" cy="60" r="6.5" fill="#fff6cf" stroke="#5a2030" stroke-width="3.5"/>
</svg>
