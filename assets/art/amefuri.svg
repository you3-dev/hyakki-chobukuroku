  <path d="M64 14 L 64 36 M40 20 C 36 26, 33 32, 31 41 M88 20 C 92 26, 95 32, 97 41" fill="none" stroke="#2a1f3d" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M34 27 q 30 -12 60 0" fill="none" stroke="#fff6cf" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <!-- にこにこ顔 -->
  <path d="M50 62 q 5 -6 10 0" fill="none" stroke="#2a1f3d" stroke-width="4" stroke-linecap="round"/>
  <path d="M68 62 q 5 -6 10 0" fill="none" stroke="#2a1f3d" stroke-width="4" stroke-linecap="round"/>
  <path d="M58 71 q 6 6 12 0" fill="none" stroke="#2a1f3d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="46" cy="68" r="4" fill="#e2574c" opacity="0.4"/>
  <circle cx="82" cy="68" r="4" fill="#e2574c" opacity="0.4"/>
</svg>
