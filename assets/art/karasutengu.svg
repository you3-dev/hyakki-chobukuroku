<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- からす天狗: 嘴・広げた黒翼・山伏装束・羽団扇 -->
  <!-- 黒翼(高く広げる) -->
  <path d="M48 62 C 36 48, 24 42, 10 44 C 16 50, 18 55, 16 61 C 24 58, 28 62, 27 69 C 33 66, 38 69, 38 76 L 48 80 Z"
        fill="#3d2f5e" stroke="#2a1f3d" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M80 62 C 92 48, 104 42, 118 44 C 112 50, 110 55, 112 61 C 104 58, 100 62, 101 69 C 95 66, 90 69, 90 76 L 80 80 Z"
        fill="#3d2f5e" stroke="#2a1f3d" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- 一本歯下駄の足 -->
  <path d="M56 98 L 56 106 M72 98 L 72 106" stroke="#2a1f3d" stroke-width="7" stroke-linecap="round"/>
  <path d="M50 107 h 12 M66 107 h 12 M56 107 v 6 M72 107 v 6" stroke="#2a1f3d" stroke-width="4" stroke-linecap="round"/>
  <!-- 山伏装束 -->
  <path d="M52 68 C 46 76, 44 88, 46 100 L 82 100 C 84 88, 82 76, 76 68 Z"
        fill="#f5f0e6" stroke="#2a1f3d" stroke-width="5" stroke-linejoin="round"/>
  <!-- 袴 -->
  <path d="M46 89 L 82 89 L 82 100 L 46 100 Z" fill="#5eb87a" stroke="#2a1f3d" stroke-width="4" stroke-linejoin="round"/>
  <!-- 結袈裟の梵天 -->
  <circle cx="58" cy="76" r="3.5" fill="#fff6cf" stroke="#2a1f3d" stroke-width="3"/>
  <circle cx="70" cy="76" r="3.5" fill="#fff6cf" stroke="#2a1f3d" stroke-width="3"/>
  <!-- 羽団扇を持つ腕 -->
  <path d="M78 74 C 86 76, 92 82, 92 88" fill="none" stroke="#2a1f3d" stroke-width="9" stroke-linecap="round"/>
  <path d="M78 74 C 86 76, 92 82, 92 88" fill="none" stroke="#f5f0e6" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M94 88 C 92 76, 96 64, 107 59 C 110 65, 110 74, 105 81 C 110 79, 114 75, 116 70 C 116 81, 109 90, 99 92 Z"
        fill="#5eb87a" stroke="#2a1f3d" stroke-width="4" stroke-linejoin="round"/>
  <path d="M96 87 C 98 77, 103 68, 109 63" fill="none" stroke="#2a1f3d" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- 頭(黒羽・大きめ) -->
  <path d="M42 42 C 42 26, 52 18, 64 18 C 76 18, 86 26, 86 42 C 86 55, 76 64, 64 64 C 52 64, 42 55, 42 42 Z"
        fill="#3d2f5e" stroke="#2a1f3d" stroke-width="5" stroke-linejoin="round"/>
  <!-- 後頭の羽毛はね -->
  <path d="M84 46 L 92 44 L 86 52 L 93 53 L 85 58" fill="none" stroke="#2a1f3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 頭襟 -->
  <path d="M55 20 L 57 9 L 71 9 L 73 20 Z" fill="#e2574c" stroke="#2a1f3d" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M60 14.5 h 8" stroke="#fff6cf" stroke-width="2.5" stroke-linecap="round"/>
  <!-- きりりとした目 -->
  <circle cx="54" cy="41" r="6.5" fill="#f5f0e6" stroke="#2a1f3d" stroke-width="3.5"/>
  <circle cx="74" cy="41" r="6.5" fill="#f5f0e6" stroke="#2a1f3d" stroke-width="3.5"/>
  <circle cx="55.5" cy="42" r="2.8" fill="#2a1f3d"/>
  <circle cx="72.5" cy="42" r="2.8" fill="#2a1f3d"/>
  <path d="M47 32 l 11 4 M81 32 l -11 4" stroke="#2a1f3d" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 大きな嘴 -->
  <path d="M54 50 C 58 47.5, 70 47.5, 74 50 L 66 63 C 65 64.5, 63 64.5, 62 63 Z"
        fill="#ffb347" stroke="#2a1f3d" stroke-width="4" stroke-linejoin="round"/>
  <path d="M55.5 53 q 8.5 3.5 17 0" fill="none" stroke="#2a1f3d" stroke-width="2.5" stroke-linecap="round"/>
</svg>
