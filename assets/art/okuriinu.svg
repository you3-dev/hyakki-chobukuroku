<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 送り犬: 夜道をつけてくる痩せた山犬 -->
  <!-- 尻尾 -->
  <path d="M82 96 C 96 96, 104 86, 100 72 C 108 80, 110 94, 100 102 C 94 106, 85 104, 82 96 Z"
        fill="#aab2c0" stroke="#2a1f3d" stroke-width="4" stroke-linejoin="round"/>
  <!-- 座った痩せ身の胴 -->
  <path d="M46 110 C 42 92, 47 78, 64 76 C 81 78, 86 92, 82 110 Z"
        fill="#aab2c0" stroke="#2a1f3d" stroke-width="5" stroke-linejoin="round"/>
  <!-- 胸の白毛 -->
  <path d="M59 82 C 62 80, 66 80, 69 82 C 70 87, 69 92, 64 95 C 59 92, 58 87, 59 82 Z" fill="#f5f0e6"/>
  <!-- あばら -->
  <path d="M49 90 q 5 2 6 8 M48 98 q 4 2 5 7" fill="none" stroke="#2a1f3d" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M79 90 q -5 2 -6 8" fill="none" stroke="#2a1f3d" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- 前足(細く体の端に) -->
  <path d="M55 96 L 54 109" stroke="#2a1f3d" stroke-width="9" stroke-linecap="round"/>
  <path d="M55 96 L 54 109" stroke="#aab2c0" stroke-width="4.8" stroke-linecap="round"/>
  <path d="M73 96 L 74 109" stroke="#2a1f3d" stroke-width="9" stroke-linecap="round"/>
  <path d="M73 96 L 74 109" stroke="#aab2c0" stroke-width="4.8" stroke-linecap="round"/>
  <!-- 耳 -->
  <path d="M46 36 L 41 12 L 61 27 Z" fill="#aab2c0" stroke="#2a1f3d" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M82 36 L 87 12 L 67 27 Z" fill="#aab2c0" stroke="#2a1f3d" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M48 31 L 46 20 L 55 27 Z" fill="#3d2f5e"/>
  <path d="M80 31 L 82 20 L 73 27 Z" fill="#3d2f5e"/>
  <!-- 頬毛付きの頭 -->
  <path d="M42 44 C 44 31, 52 25, 64 25 C 76 25, 84 31, 86 44 C 87 50, 85 55, 81 59 L 84 64 L 76 64 C 72 67, 68 68, 64 68 C 60 68, 56 67, 52 64 L 44 64 L 47 59 C 43 55, 41 50, 42 44 Z"
        fill="#aab2c0" stroke="#2a1f3d" stroke-width="5" stroke-linejoin="round"/>
  <!-- 鋭いつり目 -->
  <path d="M47 38 L 60 43 L 60 48 L 50 45 Z" fill="#f5f0e6" stroke="#2a1f3d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M81 38 L 68 43 L 68 48 L 78 45 Z" fill="#f5f0e6" stroke="#2a1f3d" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="56" cy="44" r="2.3" fill="#2a1f3d"/>
  <circle cx="72" cy="44" r="2.3" fill="#2a1f3d"/>
  <!-- マズル -->
  <path d="M55 52 C 57 48, 71 48, 73 52 C 74 58, 70 62, 64 62 C 58 62, 54 58, 55 52 Z"
        fill="#f5f0e6" stroke="#2a1f3d" stroke-width="3.5"/>
  <path d="M60 51.5 L 68 51.5 L 64 56 Z" fill="#2a1f3d"/>
  <!-- 唸る口と牙 -->
  <path d="M57 58.5 q 7 4.5 14 0" fill="none" stroke="#2a1f3d" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M57 57.5 l 1.5 5.5 l 3 -4 Z" fill="#f5f0e6" stroke="#2a1f3d" stroke-width="2"/>
  <path d="M71 57.5 l -1.5 5.5 l -3 -4 Z" fill="#f5f0e6" stroke="#2a1f3d" stroke-width="2"/>
</svg>
